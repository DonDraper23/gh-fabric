name: Publish GH-Fabric
run-name: ${{ inputs.source == 'wordpress' && 'Publish WordPress update' || 'Publish GH-Fabric' }}
on:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'site.css'
      - 'worker.mjs'
      - 'package*.json'
      - 'wrangler.jsonc'
      - '.github/workflows/cms-reconcile.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Publication source
        type: choice
        options: [manual, wordpress]
        default: manual
      page_id:
        description: Published WordPress page ID
        type: string
        required: false
      modified:
        description: WordPress modification time in UTC
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: gh-fabric-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GHF_WP_FRESH: ${{ inputs.source == 'wordpress' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Wait until the WordPress index shows the product update
        if: inputs.source == 'wordpress'
        run: node scripts/await-page.mjs
        env:
          EDITED_PAGE_ID: ${{ inputs.page_id }}
          EDITED_PAGE_TIME: ${{ inputs.modified }}
      - name: Check for changes since the last successful publication
        id: compare
        if: github.event_name == 'schedule'
        run: node scripts/revision.mjs --compare >> "$GITHUB_OUTPUT"
      - name: Build and verify the published catalogue
        if: github.event_name != 'schedule' || steps.compare.outputs.changed == 'true'
        run: npm run build && npm run check
      - name: Deploy to the GH-Fabric Worker
        if: github.event_name != 'schedule' || steps.compare.outputs.changed == 'true'
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the customer-facing domain after deployment
        if: github.event_name != 'schedule' || steps.compare.outputs.changed == 'true'
        run: node scripts/check-live.mjs --built
